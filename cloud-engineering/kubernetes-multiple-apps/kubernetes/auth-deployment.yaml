apiVersion: apps/v1
kind: Deployment
metadata:
  name: ce-smart-home-auth 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ce-smart-home-auth 
  template:
    metadata:
      labels:
        app: ce-smart-home-auth
    spec:
      containers:
        - name: ce-smart-home-auth  
          image: femy4ever/ce-smart-home-auth:latest
          ports:
          - containerPort: 3000
