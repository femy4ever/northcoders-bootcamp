apiVersion: apps/v1
kind: Deployment
metadata:
  name: cat-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cat-server
  template:
    metadata:
      labels:
        app: cat-server
    spec:
      containers:
      - name: cat-server
        image: femy4ever/cat-server:2.0.0
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"