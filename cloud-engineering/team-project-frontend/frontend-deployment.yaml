apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: "femy4ever/frontend:1.0.0"
        ports:
        - containerPort: 80
        resources:
          requests: # Minimum guaranteed resources
            memory: "64Mi" 
            cpu: "250m"  
          limits: # Maximum resources allowed
            memory: "128Mi" 
            cpu: "500m" 
